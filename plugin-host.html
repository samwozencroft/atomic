<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'unsafe-inline'; connect-src https: http://127.0.0.1:* http://localhost:*; img-src data: https:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <style>
    :root {
      --bg-dark: #282c34;
      --bg-darker: #21252b;
      --bg-darkest: #181a1f;
      --text-normal: #abb2bf;
      --text-muted: #5c6370;
      --border-color: #181a1f;
      --accent-blue: #61afef;
      --accent-purple: #c678dd;
      --hover-bg: #2c313a;
      --active-bg: #323842;
    }
    * { box-sizing: border-box; }
    html, body, #plugin-root { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--bg-dark); color: var(--text-normal); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #plugin-root { overflow: auto; padding: 10px; }
    .btn { border: 1px solid var(--border-color); border-radius: 3px; padding: 6px 12px; background: #3a3f4b; color: #d7dae0; cursor: pointer; }
  </style>
</head>
<body>
  <div id="plugin-root"></div>
  <script src="plugin-host.js"></script>
</body>
</html>
